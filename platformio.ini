; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino

build_flags = 
    -DARDUINO_PIO
    -DDEBUG

lib_deps = 

    ; TODO: 
    ;   JDH to go through dependencies below and dowload as ZIP archives
    ;   to avoid online dependencies for field deployment 

    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; System dependencies
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; CHILLIB
    symlink://../chillib
    
    ; RTC clock on SAMD21
    lib/RTCZero-1.6.0.zip

    ; SD Arduino library
    lib/SD-1.3.0.zip

    ; SDFat library for file system
    lib/SdFat-2.0.1.zip
    
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; Sensor dependencies
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; BMA400 (accelerometer) library from SparkFUn
    lib/SparkFun_BMA400_Arduino_Library-1.0.0.zip

    ; MS5607 Barometer and Temperature sensor
    lib/MS5607-master.zip

    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; Communication dependencies
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; IridiumSBD library for RockBlock satellite modem
    lib/SparkFun_IridiumSBD_I2C_Arduino_Library-3.1.0.zip

    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; Display dependencies
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    lib/Adafruit_BusIO-1.17.4.zip
    lib/Adafruit-GFX-Library-1.12.6.zip
    lib/Adafruit_SHARP_Memory_Display-1.1.4.zip
    
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    ; GNSS dependencies
    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
    lib/SparkFun_u-blox_GNSS_Arduino_Library-2.2.28.zip

